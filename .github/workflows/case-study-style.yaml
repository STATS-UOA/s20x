name: case-study-style

on:
  push:
    branches: [master]
    paths: ["inst/case_studies/**"]
  pull_request:
    branches: [master]
    paths: ["inst/case_studies/**"]

permissions:
  contents: read

jobs:
  case-study-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::styler
          dependencies: '"hard"'

      - name: Check case study spacing
        run: Rscript scripts/styleCaseStudies.R --check
