name: pkgdown

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Prepare case study articles
        run: Rscript scripts/prepareSiteArticles.R

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # pkgdown publishes every Markdown file at the top level. This commit stays
      # on the runner, and keeps the file off the site.
      - name: Remove files that should not be published
        run: |
          git rm -q CLAUDE.md
          git commit -q -m "Remove files that should not be published"

      - name: Build and deploy pkgdown site
        run: pkgdown::deploy_to_branch(new_process = FALSE, clean = TRUE)
        shell: Rscript {0}
